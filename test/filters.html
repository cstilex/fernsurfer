<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fernsurfer Filtertest</title>
<!-- Simuliert die TizenBrew-Injektion (Test-Build mit test-rules.txt) -->
<script src="userScript.test.js"></script>
<script>
  // Diese Skripte laufen NACH dem Modul, wie Werbe-/Anti-Adblock-Skripte einer Seite
  window.results = {};
  window.testAdFlag = false;
  results.setConstant = window.testAdFlag === true;

  try { var x = window.adBlockDetector; results.aopr = false; } catch (e) { results.aopr = true; }

  results.timerRan = false;
  setTimeout(function adTimer() { results.timerRan = true; }, 10);
  results.normalTimerRan = false;
  setTimeout(function () { results.normalTimerRan = true; }, 10);

  var parsed = JSON.parse('{"ads":[1,2],"content":"ok"}');
  results.jsonPruned = !('ads' in parsed) && parsed.content === 'ok';

  results.adHandlerRan = false;
  results.goodHandlerRan = false;
  window.addEventListener('test-evt', function adHandler() { results.adHandlerRan = true; });
  window.addEventListener('test-evt', function goodHandler() { results.goodHandlerRan = true; });
  window.dispatchEvent(new Event('test-evt'));
</script>
<style>
  body { font: 18px sans-serif; margin: 24px; }
  div { padding: 6px; margin: 4px 0; background: #eee; }
</style>
</head>
<body>
  <h1>Filtertest</h1>
  <div id="g" class="adsbygoogle-box">generisch (EasyList): soll unsichtbar sein</div>
  <div id="s" class="test-ad-specific">seitenspezifisch: soll unsichtbar sein</div>
  <div id="u" class="test-unhide">Ausnahme: soll SICHTBAR bleiben</div>
  <div id="st" class="styled-test">:style: soll rot sein</div>
  <div id="c" class="test-complex"><span class="inner" id="ci">komplex: soll unsichtbar sein</span><span id="co">soll sichtbar bleiben</span></div>
  <div id="ok">normaler Inhalt: soll sichtbar bleiben</div>
  <div id="slot"></div>

<script>
  // Werbung, die spaeter nachgeladen wird
  setTimeout(function () {
    var ad = document.createElement('div');
    ad.id = 'late';
    ad.className = 'adsbygoogle-box';
    ad.textContent = 'spaet nachgeladen: soll unsichtbar sein';
    document.getElementById('slot').appendChild(ad);
  }, 300);

  // Werbeskript von einem gesperrten Host
  var sc = document.createElement('script');
  sc.src = 'https://ads-test.invalid/ad.js';
  results.scriptSrcBlocked = sc.src === '';
  var sc2 = document.createElement('script');
  sc2.setAttribute('src', 'https://ads-test.invalid/ad2.js');
  results.setAttrBlocked = !sc2.getAttribute('src');
  fetch('https://ads-test.invalid/track').then(function () { results.fetchBlocked = false; },
                                                function () { results.fetchBlocked = true; });
</script>
</body>
</html>
