<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fremder Videoplayer</title>
<script src="userScript.test.js"></script>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .player { position: relative; width: 100%; height: 270px; background: #000; }
  .player video { width: 100%; height: 100%; display: block; }
  .clickjack { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: rgba(0,0,0,.5); }
  .bar button { position: absolute; top: 4px; height: 28px; right: 6px; }
</style>
</head>
<body>
  <div class="player">
    <video id="v2" muted playsinline></video>
    <div class="clickjack" id="cj2"></div>
    <div class="bar"><button class="vjs-fullscreen-control" id="fs2" title="Vollbild"><svg width="14" height="14"><rect x="1" y="1" width="12" height="12" fill="none" stroke="#000"/></svg></button></div>
  </div>
  <script src="video-test.js"></script>
</body>
</html>
