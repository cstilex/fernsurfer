<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fernsurfer Test</title>
<!-- Simuliert die TizenBrew-Injektion -->
<script src="../dist/userScript.js"></script>
<style>
  body { font: 18px sans-serif; margin: 24px; background: #f4f4f4; }
  #player { position: relative; width: 640px; height: 300px; background: #222; color: #fff; }
  #playBtn { position: absolute; left: 280px; top: 120px; padding: 16px 24px; font-size: 20px; }
  #trap { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  iframe { width: 640px; height: 200px; border: 2px solid #888; margin-top: 16px; background: #fff; }
  #log { margin-top: 16px; font-family: monospace; white-space: pre; }
</style>
</head>
<body>
  <h1>Fernsurfer Testseite</h1>

  <div id="player">
    <button id="playBtn">Play</button>
    <!-- Klick-Falle: unsichtbarer Link ueber dem ganzen Player -->
    <a id="trap" href="https://ads.example.net/landing" target="_blank" style="opacity:0"></a>
  </div>

  <p>
    <button id="openBtn">window.open direkt</button>
    <button id="iframeTrick">window.open aus frischem iframe</button>
    <button id="detached">versteckter a.click()</button>
    <a id="realBlank" href="#ziel" target="_blank">echter _blank-Link (soll im selben Fenster bleiben)</a>
  </p>

  <iframe id="cross" src="http://localhost:8765/test/frame.html"></iframe>

  <div id="log"></div>

<script>
  window.results = { popupsOpened: 0, plays: 0, frameEvents: [] };
  function log(t) { document.getElementById('log').textContent += t + '\n'; }

  function tryPopup(how, fn) {
    var w = fn();
    // Ein echtes Popup haette ein "window"-Objekt mit eigenem document.
    var real = !!w && w !== null && typeof w.document === 'object' && w.document && typeof w.document.createElement === 'function';
    if (real) { window.results.popupsOpened++; try { w.close(); } catch (e) {} }
    log(how + ': ' + (real ? 'POPUP GEOEFFNET' : 'blockiert'));
  }

  document.getElementById('playBtn').addEventListener('click', function () {
    window.results.plays++;
    log('Play geklickt (' + window.results.plays + ')');
  });

  document.getElementById('openBtn').addEventListener('click', function () {
    tryPopup('window.open', function () { return window.open('https://ads.example.net/a', '_blank'); });
  });

  document.getElementById('iframeTrick').addEventListener('click', function () {
    tryPopup('iframe-Trick', function () {
      var f = document.createElement('iframe');
      f.style.display = 'none';
      document.body.appendChild(f);
      var o = f.contentWindow.open;
      return o.call(window, 'https://ads.example.net/b', '_blank');
    });
  });

  document.getElementById('detached').addEventListener('click', function () {
    var a = document.createElement('a');
    a.href = 'https://ads.example.net/c';
    a.target = '_blank';
    var before = window.results.popupsOpened;
    a.click();
    log('versteckter a.click(): ausgefuehrt (Popup-Status siehe Toast/Zaehler)');
  });

  // Typischer Popunder: beim ersten Klick irgendwo auf der Seite
  document.addEventListener('click', function once() {
    document.removeEventListener('click', once);
    tryPopup('Popunder beim ersten Klick', function () { return window.open('https://ads.example.net/pop', '_blank'); });
  });

  window.addEventListener('message', function (ev) {
    if (ev.data && ev.data.test) { window.results.frameEvents.push(ev.data.test); log('iframe: ' + ev.data.test); }
  });
</script>
</body>
</html>
